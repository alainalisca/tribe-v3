name: CI

# Run on EVERY push (any branch) and EVERY pull request. The old
# 'only main' filter meant feature branches accumulated commits
# without checks — that's how 12 failing tests were able to sit
# red on feature/tribe-os for weeks. Branch-scoped runs catch
# regressions before they pile up.
on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Warning budget breakdown (2026-05-15 update):
        #   ~ 250 legacy warnings (unused vars, explicit any, etc.)
        #   ~1550 i18n-backlog warnings (no-restricted-syntax rule flagging
        #         every surviving `language === 'es'` ternary that hasn't
        #         been migrated to useTranslations yet — see UI-I01/I02).
        # Budget raised from 1750 → 1850 to accommodate the feature/tribe-os
        # sprint (new components were built with the inline-copy pattern
        # since the i18n hook had no message-key infrastructure for the new
        # surfaces yet). Migration of those surfaces to useTranslations is
        # planned for Phase 2 of the spec.
        # Each migrated file drops the count. Target: cut by 200/week.
        # Do NOT raise this ceiling without a PR comment explaining why.
        run: npx eslint app/ lib/ components/ hooks/ --max-warnings 1850

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        # Tests are blocking. The full suite (currently 577) must pass.
        # vitest.config.ts no longer excludes any test files — the 12
        # stale fixtures that used to be excluded were fixed in
        # d6ecab5 + follow-ups.
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
          NEXT_PUBLIC_POSTHOG_KEY: 'placeholder'
          NEXT_PUBLIC_POSTHOG_HOST: 'https://placeholder.posthog.com'
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: 'placeholder'
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: 'placeholder'

      - name: Bundle size budget
        # Gates on what a browser actually downloads for the home page, not on
        # the size of the build output.
        #
        # Changed on 2026-09-09 by T-PERF1. The old gate summed every chunk for
        # all 77 routes (`du -sk .next/static/chunks`). That number is build
        # output: code splitting moves bytes between chunks without changing
        # it, so the gate punished exactly the work it was supposed to
        # encourage. It also read 7600 KB while the home page downloaded 1452,
        # which is how T-UI3 got blocked by a 12 KB feature and had to raise
        # the ceiling from 7600 to 7800.
        #
        # The new number is the sum of the scripts the prerendered home page
        # references — the bytes an athlete on 4G in Medellin actually pays
        # for. Measured at 1414 KB after T-PERF1's LazyMotion split (down from
        # 1452). Budget set to 1520 KB, about 100 KB of headroom.
        #
        # The all-chunks total is still printed, clearly labelled as
        # informational, so the two can never be confused again.
        #
        # Method note: Next 16 stopped printing per-route First Load JS and
        # @next/bundle-analyzer is webpack-only, so it emits no report against
        # a Turbopack build. Reading the prerendered page's script tags is the
        # house method now; see scripts/measure-bundle.mjs.
        #
        # Still a CEILING, not a target. Ratchet DOWN. Known remaining weight
        # lives in the shared chunk every route pays (543 KB across 8 files).
        run: node scripts/measure-bundle.mjs 1520
